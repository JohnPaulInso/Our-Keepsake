<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- (2026-07-13) Trailing slash router guard & favicon links; was missing -->
    <script>
      (function () {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <!-- (2026-07-13) Set custom capybara wax seal favicon with cache bust; was photo -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <!-- (2026-07-13) Set mobile viewport lock per SKILL.md vs default viewport -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
