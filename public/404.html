<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Our Keepsake</title>
    <script>
      // Single Page Apps for GitHub Pages: redirect 404 to index with hash
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      var query = window.location.search;
      var hash = window.location.hash;
      var redirectUrl = window.location.origin + (repo ? '/' + repo : '') + '/#' + path.replace('/' + repo, '') + query + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
