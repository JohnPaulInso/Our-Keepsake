<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="wax-outer" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#b48c74"/>
      <stop offset="45%" stop-color="#7a5b46"/>
      <stop offset="85%" stop-color="#4a3426"/>
      <stop offset="100%" stop-color="#322218"/>
    </radialGradient>
    <radialGradient id="wax-inner" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8a6952"/>
      <stop offset="70%" stop-color="#553a29"/>
      <stop offset="100%" stop-color="#3b271b"/>
    </radialGradient>
    <linearGradient id="gold-ring" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffeb99"/>
      <stop offset="25%" stop-color="#f0c85c"/>
      <stop offset="60%" stop-color="#c6952e"/>
      <stop offset="85%" stop-color="#e6be50"/>
      <stop offset="100%" stop-color="#916a1b"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c2253b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a0f0a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Wax Stamp Base -->
  <circle cx="256" cy="256" r="236" fill="url(#wax-outer)" filter="url(#soft-shadow)"/>
  
  <!-- Embossed Gold Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold-ring)" stroke-width="12" opacity="0.95"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#362217" stroke-width="3" opacity="0.6"/>
  
  <!-- Inner Recessed Wax Bed -->
  <circle cx="256" cy="256" r="195" fill="url(#wax-inner)"/>
  
  <!-- Capybara Silhouette (Cream Cotton Paper Emboss) -->
  <!-- Body -->
  <path d="M150 325 C140 295 150 265 180 250 C210 240 240 245 270 245 C310 245 340 260 360 285 C370 300 370 325 355 340 C340 350 310 350 250 350 C190 350 160 345 150 325 Z" fill="#fdfbf7"/>
  <!-- Head -->
  <path d="M260 245 C260 225 270 205 290 195 C310 185 340 185 365 200 C380 210 385 230 385 250 C380 265 365 275 345 275 C320 275 290 265 260 245 Z" fill="#fdfbf7"/>
  <!-- Ear -->
  <circle cx="290" cy="190" r="13" fill="#e2d2c5"/>
  <!-- Cute Sleeping Eye -->
  <path d="M340 220 Q355 210 365 220" stroke="#483325" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Nose/Muzzle -->
  <circle cx="375" cy="235" r="6" fill="#483325"/>
  
  <!-- Crimson Love Heart -->
  <path d="M320 170 C320 155 305 145 295 155 C285 145 270 155 270 170 C270 185 295 200 295 200 C295 200 320 185 320 170 Z" fill="url(#heart-grad)"/>
</svg>
